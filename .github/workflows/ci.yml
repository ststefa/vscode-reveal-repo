name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: |
          node --check extension.js
          node --check test/extension.test.js

      - name: Run tests
        run: npm test
